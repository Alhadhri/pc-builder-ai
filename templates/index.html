<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد تجميع الحاسوب الذكي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f9; }
        .hero-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 40px 0; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .btn-primary { background-color: #1e3c72; border: none; padding: 10px 25px; border-radius: 10px; }
        .result-item { border-right: 4px solid #1e3c72; background: #fff; margin-bottom: 10px; padding: 15px; border-radius: 8px; }
        .badge-custom { background-color: #e9ecef; color: #1e3c72; font-weight: bold; }
    </style>
</head>
<body>

<div class="hero-section text-center mb-5">
    <h1 class="fw-bold">AI PC Builder</h1>
    <p>صمم تجميعتك المثالية باستخدام خوارزميات البحث الذكية</p>
</div>

<div class="container">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-4">
                <h5 class="mb-4 text-center">تحديد المواصفات</h5>
                <div class="mb-3">
                    <label class="form-label">الميزانية ($)</label>
                    <input type="number" id="budget" class="form-control" placeholder="مثلاً: 1500" value="1000">
                </div>
                <div class="mb-3">
                    <label class="form-label">الغرض من الجهاز</label>
                    <select id="purpose" class="form-select">
                        <option value="Gaming">ألعاب (Gaming)</option>
                        <option value="AI/ML">ذكاء اصطناعي (AI/ML)</option>
                        <option value="Office">أعمال مكتبية (Office)</option>
                        <option value="Content">صناعة محتوى(Content)</option>
                        <option value="Economic">البناء الاقتصادي(Economic)</option>
                        <option value="Professional">البناء الاحترافي(Professional)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label">خوارزمية البحث</label>
                    <select id="algorithm" class="form-select">
                        <option value="A*">A* Search (الأذكى والأسرع)</option>
                        <option value="UCS">Uniform Cost Search (الأرخص)</option>
                        <option value="BFS">Breadth-First Search (الأسرع)</option>
                        <option value="DFS">Depth-First Search (الأعمق)</option>
                    </select>
                </div>
                <button onclick="generateBuild()" class="btn btn-primary w-100 fw-bold">توليد التجميعة</button>
            </div>
        </div>

        <div class="col-md-8">
            <div id="loading" class="text-center d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p>جاري البحث عن أفضل القطع...</p>
            </div>
            
            <div id="results" class="d-none">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="m-0">النتيجة المقترحة</h5>
                        <span class="badge badge-custom p-2" id="stat-nodes"></span>
                    </div>
                    <div id="build-details"></div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="text-success fw-bold m-0" id="total-price"></h4>
                        <span class="text-muted" id="algo-info"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function generateBuild() {
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        loading.classList.remove('d-none');
        results.classList.add('d-none');

        const payload = {
            budget: document.getElementById('budget').value,
            purpose: document.getElementById('purpose').value,
            algorithm: document.getElementById('algorithm').value
        };

        try {
            const response = await fetch('/build', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if (data.success) {
                let html = '';
                for (const [category, comp] of Object.entries(data.build)) {
                    html += `
                        <div class="result-item d-flex justify-content-between align-items-center shadow-sm">
                            <div>
                                <small class="text-muted d-block">${category}</small>
                                <strong>${comp.name}</strong>
                            </div>
                            <span class="fw-bold text-primary">$${comp.price_usd}</span>
                        </div>`;
                }
                document.getElementById('build-details').innerHTML = html;
                document.getElementById('total-price').innerText = `الإجمالي: $${data.total_cost}`;
                document.getElementById('stat-nodes').innerText = `عدد العقد التي تمت زيارتها: ${data.nodes}`;
                document.getElementById('algo-info').innerText = `بواسطة: ${data.algorithm_used}`;
                results.classList.remove('d-none');
            } else {
                alert(data.message);
            }
        } catch (error) {
            console.error(error);
            alert("حدث خطأ في الاتصال بالسيرفر");
        } finally {
            loading.classList.add('d-none');
        }
    }
</script>
</body>
</html>
